name: DB security tests

on:
  pull_request:
    paths:
      - "drizzle/migrations/**"
      - "tests/db/**"
      - "scripts/test-db.sh"
  push:
    branches: [main]
    paths:
      - "drizzle/migrations/**"
      - "tests/db/**"
      - "scripts/test-db.sh"

jobs:
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-db.sh
